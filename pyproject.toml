[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zentromart-voiceops-2026"
version = "0.1.0"
description = "Grounded ZentroMart customer support agent with Gnani STT and TTS"
requires-python = ">=3.10"
dependencies = ["gnani-vachana", "python-dotenv>=1.0.0"]

[tool.setuptools.packages.find]
where = ["src"]
